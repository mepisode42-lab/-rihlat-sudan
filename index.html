<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رحلات السودان - 18 ولاية - شات</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma}
body{background:#065f46;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
#loginBox{background:white;width:100%;max-width:390px;border-radius:22px;padding:22px;box-shadow:0 20px 40px #0004}
.tabs{display:flex;gap:6px;margin:14px 0;background:#f1f5f9;padding:4px;border-radius:12px}
.tab{flex:1;padding:11px;text-align:center;border-radius:9px;cursor:pointer;font-size:13px;color:#64748b;font-weight:700}
.tab.active{background:#16a34a;color:white}
input,select{width:100%;padding:13px;border:2px solid #e2e8f0;border-radius:11px;margin-top:9px;font-size:14px;background:#f8fafc}
.btn{width:100%;padding:13px;border:none;border-radius:11px;font-weight:800;margin-top:10px;cursor:pointer;font-size:14px}
.green{background:#16a34a;color:white}
.white{background:white;border:1px solid #cbd5e1;color:#334155}
.hidden{display:none!important}
#app{position:fixed;inset:0;background:#f8fafc;display:flex;flex-direction:column;z-index:50}
.header{background:#16a34a;color:white;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.content{flex:1;overflow:auto;padding:12px;padding-bottom:85px;max-width:580px;margin:0 auto;width:100%}
.card{background:white;border:1px solid #e2e8f0;border-radius:16px;padding:14px;margin-top:12px}
.trip{border:1px solid #e2e8f0;background:white;border-radius:13px;padding:11px;margin:8px 0;display:flex;justify-content:space-between;align-items:center}
.nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e2e8f0;display:flex;padding:6px;z-index:60}
.n-tab{flex:1;text-align:center;font-size:11px;color:#94a3b8;padding:8px;cursor:pointer}
.n-tab.active{color:#16a34a;font-weight:800}
.chat-box{position:fixed;inset:0;background:#e5ddd5;z-index:200;display:flex;flex-direction:column}
.chat-header{background:#075e54;color:white;padding:12px;display:flex;justify-content:space-between;align-items:center}
.chat-msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:78%;padding:8px 12px;border-radius:14px;font-size:13px;line-height:1.4}
.msg.me{background:#dcf8c6;align-self:flex-end;border-radius:14px 14px 0 14px}
.msg.them{background:white;align-self:flex-start;border-radius:14px 14px 14px 0;box-shadow:0 1px 2px #0001}
.chat-input{display:flex;gap:8px;padding:10px;background:#f0f0f0;align-items:center}
.chat-input input{flex:1;margin:0;border-radius:24px;padding:12px 16px}
.chat-input button{background:#16a34a;color:white;border:none;padding:0 18px;height:44px;border-radius:24px;font-weight:900;cursor:pointer}
</style>
</head>
<body>

<div id="loginBox">
<h2 style="text-align:center">🚌 رحلات السودان</h2>
<p style="text-align:center;font-size:11px;color:#64748b;margin:8px 0">18 ولاية - حجز حقيقي - شات مباشر</p>
<div class="tabs"><div id="t1" class="tab active" onclick="setType('client')">🧳 أنا مسافر</div><div id="t2" class="tab" onclick="setType('office')">🏢 أنا مكتب</div></div>
<div id="clientForm"><input id="cName" placeholder="الاسم الكامل"><input id="cPhone" placeholder="رقم الواتساب" type="tel"><input id="cPass" placeholder="كلمة السر" type="password"><button class="btn green" onclick="doRegister()">✨ إنشاء حساب ودخول</button><button class="btn white" onclick="doLogin()">🔐 دخول</button></div>
<div id="officeForm" class="hidden"><input id="oName" placeholder="اسم المكتب"><input id="oPhone" placeholder="رقم المكتب" type="tel"><input id="oCity" placeholder="المدينة"><input id="oPass" placeholder="كلمة السر" type="password"><button class="btn green" onclick="doRegister()">🏢 تسجيل المكتب ودخول</button><button class="btn white" onclick="doLogin()">🔐 دخول المكتب</button></div>
<p id="msg" style="color:#ef4444;font-size:12px;text-align:center;margin-top:10px"></p>
<button onclick="localStorage.clear();location.reload()" style="background:none;border:none;color:#94a3b8;font-size:10px;width:100%;margin-top:12px">🗑️ مسح البيانات</button>
</div>

<div id="app" class="hidden">
<div class="header"><div><b id="uName"></b><br><small id="uPhone" style="font-size:10px;opacity:.9"></small></div><div onclick="doLogout()" style="background:#0003;padding:7px 14px;border-radius:20px;cursor:pointer;font-size:13px">🚪 خروج</div></div>
<div class="content">
<div id="clientView">
<div class="card"><h3>🔍 بحث - 18 ولاية</h3><select id="from"></select><select id="to" style="margin-top:8px"></select><input type="date" id="date" style="margin-top:8px"><button class="btn green" onclick="search()">🔍 بحث</button></div>
<div id="results"></div>
<div class="card"><h3>💬 محادثاتي</h3><div id="cChats"></div></div>
</div>
<div id="officeView" class="hidden">
<div class="card" style="border:2px solid #16a34a"><h3>➕ إضافة رحلة حقيقية</h3><select id="tf"></select><select id="tt" style="margin-top:8px"></select><div style="display:flex;gap:6px;margin-top:8px"><input id="tm" type="time" style="margin:0;flex:1"><input id="pr" type="number" placeholder="السعر" style="margin:0;flex:1"></div><input id="se" type="number" placeholder="المقاعد - 45"><input id="bu" placeholder="نوع البص - VIP"><button class="btn green" onclick="addTrip()">✅ نشر الرحلة الآن</button></div>
<div class="card"><h3>🚌 رحلاتي المنشورة</h3><div id="myTrips"></div></div>
<div class="card"><h3>📋 الحجوزات الواردة</h3><div id="inBooks"></div></div>
<div class="card"><h3>💬 رسائل العملاء</h3><div id="oChats"></div></div>
</div>
</div>
<div class="nav"><div class="n-tab active">🔍 بحث</div><div class="n-tab" onclick="document.getElementById('cChats')?.scrollIntoView({behavior:'smooth'});document.getElementById('oChats')?.scrollIntoView({behavior:'smooth'})">💬 شات <span id="chatBadge" style="background:#ef4444;color:white;border-radius:10px;padding:1px 6px;font-size:10px;display:none">0</span></div><div class="n-tab" onclick="doLogout()">🚪 خروج</div></div>
</div>

<div id="chatScreen" class="chat-box hidden">
<div class="chat-header"><div><b id="chatWith">مكتب</b><br><small id="chatSub" style="font-size:10px">متصل</small></div><div onclick="closeChat()" style="cursor:pointer;background:#0003;padding:6px 14px;border-radius:20px">✕ إغلاق</div></div>
<div id="chatMsgs" class="chat-msgs"></div>
<div class="chat-input"><input id="chatInput" placeholder="اكتب رسالة..." onkeypress="if(event.key==='Enter')sendMsg()"><button onclick="sendMsg()">➤</button></div>
</div>

<script>
let cur='client',currentChat=null;
const wilayat=["الخرطوم","نهر النيل - عطبرة","البحر الأحمر - بورتسودان","كسلا","القضارف","الجزيرة - ودمدني","النيل الأبيض - كوستي","النيل الأزرق - الدمازين","سنار","الشمالية - دنقلا","شمال كردفان - الأبيض","جنوب كردفان - كادوقلي","غرب كردفان - الفولة","شمال دارفور - الفاشر","جنوب دارفور - نيالا","غرب دارفور - الجنينة","شرق دارفور - الضعين","وسط دارفور - زالنجي"];
function fill(){["from","to","tf","tt"].forEach(id=>{let e=document.getElementById(id);if(!e)return;e.innerHTML='';wilayat.forEach(w=>e.innerHTML+=`<option>${w}</option>`)});from.value="نهر النيل - عطبرة";to.value="الخرطوم";tf.value="نهر النيل - عطبرة";tt.value="الخرطوم";date.valueAsDate=new Date();}fill();
function setType(t){cur=t;t1.classList.toggle('active',t==='client');t2.classList.toggle('active',t==='office');clientForm.classList.toggle('hidden',t!=='client');officeForm.classList.toggle('hidden',t!=='office');}
function getVals(){if(cur==='client'){return{name:cName.value.trim(),phone:cPhone.value.trim(),pass:cPass.value.trim(),city:''}}else{return{name:oName.value.trim(),phone:oPhone.value.trim(),pass:oPass.value.trim(),city:oCity.value.trim()}}}
function doRegister(){const v=getVals();if(!v.name||!v.phone||!v.pass){msg.innerText='املأ كل الحقول';return}let users={};try{users=JSON.parse(localStorage.getItem('users')||'{}')}catch(e){users={}}users[v.phone]={name:v.name,phone:v.phone,pass:v.pass,type:cur,city:v.city};localStorage.setItem('users',JSON.stringify(users));localStorage.setItem('loggedPhone',v.phone);localStorage.setItem('loggedType',cur);openApp();}
function doLogin(){const v=getVals();let users={};try{users=JSON.parse(localStorage.getItem('users')||'{}')}catch(e){users={}}let u=users[v.phone];if(!u||u.pass!==v.pass){msg.innerText='رقم أو سر خطأ';return}localStorage.setItem('loggedPhone',v.phone);localStorage.setItem('loggedType',u.type);cur=u.type;openApp();}
function openApp(){const phone=localStorage.getItem('loggedPhone');let users={};try{users=JSON.parse(localStorage.getItem('users')||'{}')}catch(e){users={}}const u=users[phone];if(!u)return;loginBox.classList.add('hidden');app.classList.remove('hidden');uName.innerText=u.name;uPhone.innerText=u.phone;if(u.type==='client'){clientView.classList.remove('hidden');officeView.classList.add('hidden');search();renderChats();}else{officeView.classList.remove('hidden');clientView.classList.add('hidden');renderMy();renderIn();renderChats();}}
function doLogout(){localStorage.removeItem('loggedPhone');localStorage.removeItem('loggedType');location.reload();}
function addTrip(){const from=tf.value,to=tt.value,time=tm.value||'06:00',price=pr.value,seats=se.value||45,bus=bu.value||'مكيف';if(!price){alert('اكتب السعر');return}let trips=[];try{trips=JSON.parse(localStorage.getItem('realTrips')||'[]')}catch(e){trips=[]}const phone=localStorage.getItem('loggedPhone');let users=JSON.parse(localStorage.getItem('users')||'{}');trips.push({id:Date.now(),officePhone:phone,officeName:users[phone].name,from,to,time,price:parseInt(price),seats:parseInt(seats),bus});localStorage.setItem('realTrips',JSON.stringify(trips));pr.value='';se.value='';bu.value='';renderMy();alert('✅ تم النشر');}
function renderMy(){const phone=localStorage.getItem('loggedPhone');let trips=[];try{trips=JSON.parse(localStorage.getItem('realTrips')||'[]')}catch(e){trips=[]}trips=trips.filter(t=>t.officePhone===phone);let h=trips.length?'':'<p style="color:#94a3b8;text-align:center;padding:15px">لا رحلات منشورة</p>';trips.reverse().forEach(t=>{h+=`<div class="trip"><div><b>${t.from} → ${t.to}</b><br><small>${t.time} - ${t.price}ج - ${t.seats} مقعد</small></div><button onclick="delTrip(${t.id})" style="background:#ef4444;color:white;border:none;padding:6px 12px;border-radius:8px">حذف</button></div>`});myTrips.innerHTML=h;}
function delTrip(id){let trips=JSON.parse(localStorage.getItem('realTrips')||'[]');trips=trips.filter(t=>t.id!==id);localStorage.setItem('realTrips',JSON.stringify(trips));renderMy();}
function search(){let trips=[];try{trips=JSON.parse(localStorage.getItem('realTrips')||'[]')}catch(e){trips=[]}const f=from.value,t=to.value;let fil=trips.filter(x=>x.from===f&&x.to===t);let h='';if(fil.length===0){h=`<div style="text-align:center;padding:25px;color:#94a3b8"><h3>لا توجد رحلات</h3><p style="font-size:11px;margin-top:8px">المكاتب: ${Object.values(JSON.parse(localStorage.getItem('users')||'{}')).filter(u=>u.type==='office').length} - الرحلات: ${trips.length}</p></div>`}else{fil.forEach(x=>{h+=`<div class="trip"><div><b>${x.officeName}</b><br><small>${x.from} → ${x.to} - ${x.time} - ${x.bus}</small></div><div style="text-align:left"><b style="color:#16a34a">${x.price.toLocaleString()}ج</b><br><button class="btn green" style="padding:5px 10px;width:auto;font-size:11px;margin-top:4px" onclick="book(${x.id})">احجز</button><br><button class="btn white" style="padding:4px 10px;width:auto;font-size:11px;margin-top:4px" onclick="openChat('${x.officePhone}','${x.officeName}')">💬 شات</button></div></div>`})}results.innerHTML=h;}
function book(id){let trips=JSON.parse(localStorage.getItem('realTrips')||'[]');let tr=trips.find(x=>x.id===id);const phone=localStorage.getItem('loggedPhone');let users=JSON.parse(localStorage.getItem('users')||'{}');let bId='#'+Math.floor(Math.random()*900000+100000);let all=[];try{all=JSON.parse(localStorage.getItem('allBookings')||'[]')}catch(e){all=[]}all.push({id:bId,officePhone:tr.officePhone,clientPhone:phone,clientName:users[phone].name,from:tr.from,to:tr.to,price:tr.price,time:new Date().toLocaleString()});localStorage.setItem('allBookings',JSON.stringify(all));alert('✅ تم الحجز '+bId);openChat(tr.officePhone,tr.officeName);}
function renderIn(){const phone=localStorage.getItem('loggedPhone');let all=[];try{all=JSON.parse(localStorage.getItem('allBookings')||'[]')}catch(e){all=[]}all=all.filter(b=>b.officePhone===phone);let h=all.length?'':'<p style="text-align:center;padding:15px;color:#94a3b8">لا حجوزات</p>';all.reverse().forEach(b=>{h+=`<div class="trip"><div><b>${b.id} - ${b.clientName}</b><br><small>${b.from}→${b.to} - ${b.clientPhone}</small></div><div><div style="color:#16a34a;font-weight:800">${b.price}ج</div><button class="btn white" style="padding:4px 8px;width:auto;font-size:10px;margin-top:4px" onclick="openChat('${b.clientPhone}','${b.clientName}')">💬 رد</button></div></div>`});inBooks.innerHTML=h;}
function getChatId(a,b){return [a,b].sort().join('_');}
function openChat(otherPhone,otherName){currentChat={otherPhone,otherName};chatWith.innerText=otherName;chatSub.innerText=otherPhone;chatScreen.classList.remove('hidden');loadMsgs();}
function closeChat(){chatScreen.classList.add('hidden');currentChat=null;renderChats();}
function loadMsgs(){if(!currentChat) return;const myPhone=localStorage.getItem('loggedPhone');const chatId=getChatId(myPhone,currentChat.otherPhone);let chats={};try{chats=JSON.parse(localStorage.getItem('chats')||'{}')}catch(e){chats={}}let msgs=chats[chatId]||[];let h='';msgs.forEach(m=>{const isMe=m.from===myPhone;h+=`<div class="msg ${isMe?'me':'them'}">${m.text}<br><small style="font-size:9px;color:#666">${m.time}</small></div>`});chatMsgs.innerHTML=h||'<p style="text-align:center;color:#888;font-size:12px;margin-top:30px">ابدأ المحادثة الآن 👋<br><small>مثال: السلام عليكم - عندكم مقعدين بكرة؟</small></p>';chatMsgs.scrollTop=chatMsgs.scrollHeight;}
function sendMsg(){if(!currentChat) return;const txt=chatInput.value.trim();if(!txt) return;const myPhone=localStorage.getItem('loggedPhone');const chatId=getChatId(myPhone,currentChat.otherPhone);let chats={};try{chats=JSON.parse(localStorage.getItem('chats')||'{}')}catch(e){chats={}}if(!chats[chatId]) chats[chatId]=[];chats[chatId].push({from:myPhone,to:currentChat.otherPhone,text:txt,time:new Date().toLocaleTimeString()});localStorage.setItem('chats',JSON.stringify(chats));chatInput.value='';loadMsgs();renderChats();}
function renderChats(){const myPhone=localStorage.getItem('loggedPhone');let chats={};try{chats=JSON.parse(localStorage.getItem('chats')||'{}')}catch(e){chats={}}let users={};try{users=JSON.parse(localStorage.getItem('users')||'{}')}catch(e){users={}}let list=[];Object.keys(chats).forEach(chatId=>{if(chatId.includes(myPhone)){const other=chatId.split('_').find(p=>p!==myPhone);const last=chats[chatId][chats[chatId].length-1];list.push({other,last});}});let hClient='',hOffice='';if(list.length===0){hClient='<p style="color:#94a3b8;font-size:11px;text-align:center;padding:10px">لا محادثات بعد</p>';hOffice='<p style="color:#94a3b8;font-size:11px;text-align:center;padding:10px">لا رسائل</p>';}else{list.forEach(l=>{const name=users[l.other]?users[l.other].name:l.other;const item=`<div class="trip" onclick="openChat('${l.other}','${name}')"><div><b>${name}</b><br><small>${l.last.text.slice(0,30)}</small></div><div style="font-size:10px;color:#888">${l.last.time}</div></div>`;hClient+=item;hOffice+=item;});}if(cChats) cChats.innerHTML=hClient;if(oChats) oChats.innerHTML=hOffice;if(list.length>0){chatBadge.innerText=list.length;chatBadge.style.display='inline';}else{chatBadge.style.display='none';}}
try{const lp=localStorage.getItem('loggedPhone');if(lp){let users=JSON.parse(localStorage.getItem('users')||'{}');if(users[lp]){cur=users[lp].type;openApp();}}}catch(e){}
setInterval(renderChats,2000);
</script>
</body>
</html>
